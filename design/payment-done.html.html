<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-on-surface": "#f0f1f2",
                        "surface-tint": "#005bc1",
                        "inverse-surface": "#2e3132",
                        "on-primary-fixed": "#001a41",
                        "on-tertiary-fixed-variant": "#7c2e00",
                        "tertiary-container": "#c64f00",
                        "background": "#f8f9fa",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "outline": "#717786",
                        "on-primary-fixed-variant": "#004493",
                        "surface-variant": "#e1e3e4",
                        "on-secondary-fixed-variant": "#26467d",
                        "on-surface": "#191c1d",
                        "surface-dim": "#d9dadb",
                        "surface-container-low": "#f3f4f5",
                        "secondary": "#405e96",
                        "primary-container": "#0070eb",
                        "on-background": "#191c1d",
                        "on-tertiary-container": "#fffbff",
                        "surface": "#f8f9fa",
                        "on-tertiary-fixed": "#351000",
                        "surface-container-high": "#e7e8e9",
                        "primary": "#0058bc",
                        "outline-variant": "#c1c6d7",
                        "surface-bright": "#f8f9fa",
                        "tertiary": "#9e3d00",
                        "surface-container": "#edeeef",
                        "on-surface-variant": "#414755",
                        "secondary-container": "#a1befd",
                        "tertiary-fixed": "#ffdbcc",
                        "on-error": "#ffffff",
                        "inverse-primary": "#adc6ff",
                        "secondary-fixed": "#d8e2ff",
                        "on-tertiary": "#ffffff",
                        "on-secondary-container": "#2d4c83",
                        "on-error-container": "#93000a",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#adc6ff",
                        "tertiary-fixed-dim": "#ffb595",
                        "surface-container-highest": "#e1e3e4",
                        "on-secondary": "#ffffff",
                        "primary-fixed": "#d8e2ff",
                        "on-secondary-fixed": "#001a41",
                        "primary-fixed-dim": "#adc6ff",
                        "on-primary-container": "#fefcff",
                        "error-container": "#ffdad6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3 {
            font-family: 'Manrope', sans-serif;
        }
        .success-gradient {
            background: linear-gradient(135deg, #0058bc 0%, #0070eb 100%);
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col items-center justify-center p-6">
<!-- Payment Success Container -->
<main class="w-full max-w-[520px] animate-in fade-in duration-700">
<!-- Logo Anchor -->
<div class="flex justify-center mb-10">
<span class="text-2xl font-black text-on-surface tracking-tighter">CloudNote</span>
</div>
<!-- Success Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_12px_32px_rgba(25,28,29,0.06)] overflow-hidden relative">
<!-- Success Indicator -->
<div class="pt-12 pb-8 flex flex-col items-center text-center px-8">
<div class="w-20 h-20 bg-primary-container/10 rounded-full flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-primary text-5xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h1 class="text-2xl font-extrabold text-on-surface tracking-[-0.02em] mb-2">결제가 완료되었습니다!</h1>
<p class="text-secondary font-medium">Pro 플랜이 활성화되었습니다</p>
</div>
<!-- Details Section -->
<div class="px-8 pb-10 space-y-6">
<div class="bg-surface-container-low rounded-xl p-6 space-y-4">
<div class="flex justify-between items-center text-sm">
<span class="text-on-surface-variant">주문 번호</span>
<span class="text-on-surface font-semibold font-mono">CN-2024-88421</span>
</div>
<div class="flex justify-between items-center text-sm">
<span class="text-on-surface-variant">결제 금액</span>
<span class="text-on-surface font-bold text-lg">₩12,900</span>
</div>
<div class="flex justify-between items-center text-sm">
<span class="text-on-surface-variant">결제 수단</span>
<span class="text-on-surface font-medium flex items-center gap-2">
<span class="material-symbols-outlined text-base">credit_card</span>
                            현대카드 (**** 1234)
                        </span>
</div>
<div class="flex justify-between items-center text-sm">
<span class="text-on-surface-variant">결제 일시</span>
<span class="text-on-surface font-medium">2024년 5월 24일 14:30</span>
</div>
<div class="pt-4 mt-4 border-t border-outline-variant/15 flex justify-between items-center text-sm">
<span class="text-on-surface-variant">다음 결제일</span>
<span class="text-primary font-bold">2024년 6월 24일</span>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-3">
<a class="success-gradient text-on-primary py-4 px-6 rounded-xl font-bold text-center transition-transform active:scale-95 shadow-lg shadow-primary/20" href="#">
                        대시보드로 이동
                    </a>
<button class="bg-surface-container-high text-on-surface-variant py-4 px-6 rounded-xl font-semibold text-center transition-colors hover:bg-surface-container-highest active:scale-95 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-xl">download</span>
                        영수증 다운로드
                    </button>
</div>
</div>
<!-- Bottom Texture -->
<div class="h-1.5 success-gradient w-full"></div>
</div>
<!-- Support Info -->
<footer class="mt-10 text-center space-y-4">
<div class="flex justify-center gap-6 text-sm text-secondary">
<a class="hover:text-primary transition-colors" href="#">결제 내역 확인</a>
<a class="hover:text-primary transition-colors" href="#">구독 관리</a>
</div>
<p class="text-xs text-on-surface-variant/70 leading-relaxed">
                결제 관련 문의사항이 있으신가요? <br/>
<a class="text-primary font-medium underline underline-offset-4 decoration-primary/30" href="mailto:support@cloudnote.com">고객지원 센터</a> 또는 help@cloudnote.com으로 연락주세요.
            </p>
</footer>
</main>
<!-- Background Decoration (Subtle) -->
<div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none overflow-hidden opacity-40">
<div class="absolute top-[-10%] right-[-5%] w-[400px] h-[400px] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-[400px] h-[400px] rounded-full bg-secondary/5 blur-[120px]"></div>
</div>
</body></html>
